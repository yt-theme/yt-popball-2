# ============================================================
# popball2 主题：Midnight（午夜 / 专业深色）
# ------------------------------------------------------------
# 设计取向（参考 macOS 活动监视器 / iStat Menus / Stats）：
#   * 中性近黑底，不再使用高饱和彩色底，克制耐看；
#   * 三条曲线按色相明确区分：
#       CPU 使用率 = 蓝；内存占用 = 翡翠绿；swap = 琥珀橙；
#   * 细边框 + 低对比分隔线，靠明度而非白线切分区域；
#   * 图表区底色由程序从 main_color 自动提亮，无需单独设置。
#
# 颜色格式：#AARRGGBB（前两位为透明度 alpha，FF=不透明）。
# 用法：把下面 [appearance] 的键值合并进 ~/.popball2_config.ini
#       对应项（只改颜色，不动其它布局/开关），重启程序即可。
# ============================================================

[appearance]
# 面板主底色：中性近黑（微冷）
main_color=#FF1C1E22
# 外边框：低对比深灰 + 细 1px（现代无边框感）
main_border_color=#FF3A3F47
main_border_width=1
# 投影
shadow_color=#FF000000

# —— 三条监控曲线（色相分明）——
# CPU 使用率：亮蓝（同时作为弹出框的强调色：图标/选中态/按钮）
cpu_usage_color=#FF5AA9FF
cpu_usage_width=1.4
# 内存占用：翡翠绿
mem_color=#FF34D399
# swap：琥珀橙
swap_color=#FFFFB020

# —— 文字颜色（各指标数值统一白色，标签/单位由程序自动弱化）——
cpu_freq_color=#FFFFFFFF
cpu_temp_color=#FFFFFFFF
net_speed_color=#FFFFFFFF
disk_io_color=#FFFFFFFF
