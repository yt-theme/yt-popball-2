[appearance]
aside_height=100
aside_width=30
charts_rows=32
cpu_freq_color=#fff
cpu_temp_color=#fff
cpu_usage_color=#4FB7DDFF
cpu_usage_width=1.1
height=100
main_border_color=#41B0DD
main_border_width=2
main_color=#13191C
mem_color=#2E6FC4
net_speed_color=#fff
disk_io_color=#fff
opacity=0.91
shadow_radius=0
shadow_color=#000000
shape=0
swap_color=#8C2A5E93
width=100

[components_show]
cpu_freq_show=0
cpu_temp_show=1
net_speed_show=1
# 磁盘读写速度：默认不展示，需要的用户可在「设置 - 显示」里勾选「磁盘读写」打开
disk_io_show=0

[disk]
# 磁盘读写速度统计哪块盘：
#   disk_io_mode=0 → 自动选当前 IO 最高的盘（默认）
#   disk_io_mode=1 → 固定 disk_io_name 指定的盘（如 sda / nvme0n1 / disk0 / 0 C:）
disk_io_mode=0
disk_io_name=

[aside]
# 贴边竖条：把小球拖到屏幕左/右边缘，会吸附成一根圆角竖条，用窄柱图显示各指标。
# 拖动竖条往屏幕里侧移开（或单击竖条）即可变回小球。
snap_to_edge=1
# 当前吸附在哪一侧：10 = 左边缘，11 = 右边缘（程序自己记，一般不用手改）
aside_edge=11
# 竖条圆角半径（px）；竖条宽度/高度见上面 appearance 段的 aside_width / aside_height
corner_radius=8

[position]
x=300
y=300

[ui]
# 数据中转站面板的展示布局：0=图标网格（默认）1=列表 2=详细
dock_view_style=0
# 数据中转站弹窗尺寸（px）
dock_width=330
dock_height=452
# 弹窗优先展示位置：0=自动（空间大的一侧） 1=悬浮球右侧 2=悬浮球左侧 3=屏幕居中
dock_position=0
# 弹窗内容密度：0=紧凑 1=标准（默认） 2=宽松
dock_density=1

[meta]
# 配置结构版本号：程序靠它对新装/老配置做一次性默认值迁移，一般不用手改。
#   1 → 磁盘读写默认显示（旧）
#   2 → 磁盘读写默认不显示（当前）
config_version=2

[timer]
update_data_interval=450
update_ui_interval=450

[window]
# 形状蒙版（桌面没开混成时用来裁掉矩形黑框）
# 0 = 自动  1 = 强制开启  2 = 关闭
shape_mask=0

[system_monitor]
# 右键菜单「系统监视器」调用的命令；留空 = 自动按桌面环境/窗口管理器检测。
# 可填绝对路径命令，也可带参数，例如：
#   Windows : C:\Windows\System32\Taskmgr.exe
#   Linux   : /usr/bin/gnome-system-monitor
#   macOS   : open -a "Activity Monitor"
cmd=
