[appearance]
aside_height=100
aside_width=30
charts_rows=32
cpu_freq_color=#fff
cpu_temp_color=#fff
cpu_usage_color=#4FB7DDFF
cpu_usage_width=1.1
height=100
main_border_color=#41B0DD
main_border_width=2
main_color=#13191C
mem_color=#2E6FC4
net_speed_color=#fff
disk_io_color=#fff
opacity=0.91
shadow_radius=0
shadow_color=#000000
shape=0
swap_color=#8C2A5E93
gpu_usage_color=#FFC084FC
width=100

[components_show]
cpu_freq_show=0
cpu_temp_show=1
net_speed_show=1
# 磁盘读写速度：默认不展示，需要的用户可在「设置 - 显示」里勾选「磁盘读写」打开
disk_io_show=0
gpu_temp_show=1

[disk]
# 磁盘读写速度统计哪块盘：
#   disk_io_mode=0 → 自动选当前 IO 最高的盘（默认）
#   disk_io_mode=1 → 固定 disk_io_name 指定的盘（如 sda / nvme0n1 / disk0 / 0 C:）
disk_io_mode=0
disk_io_name=

[aside]
# 贴边竖条：把小球拖到屏幕左/右边缘，会吸附成一根圆角竖条，用窄柱图显示各指标。
# 拖动竖条往屏幕里侧移开（或单击竖条）即可变回小球。
snap_to_edge=1
# 当前吸附在哪一侧：10 = 左边缘，11 = 右边缘（程序自己记，一般不用手改）
aside_edge=11
# 竖条圆角半径（px）；竖条宽度/高度见上面 appearance 段的 aside_width / aside_height
corner_radius=8

[position]
x=300
y=300

[ui]
# 数据中转站面板的展示布局：0=图标网格 1=列表（默认）2=详细
dock_view_style=1
ball_style=0
# 悬浮球外圈显示内存占用比例环图：1=开启 0=关闭（默认）；仅球形形态有效
ring_mem=0
# 内存环宽度（px）：仅 ring_mem 开启时生效
ring_mem_width=3
# 鼠标悬停悬浮球跑环息屏：1=开启 0=关闭（默认）；环跑满后关闭显示器，移动鼠标恢复
hover_sleep=0
# 数据中转站弹窗尺寸（px）
dock_width=330
dock_height=452
# 弹窗优先展示位置：0=自动（空间大的一侧） 1=悬浮球右侧 2=悬浮球左侧 3=屏幕居中
dock_position=0
# 弹窗内容密度：0=紧凑 1=标准（默认） 2=宽松
dock_density=1
# 弹窗背景不透明度（千分比 0~1000）：默认 871 = 87.1%
dock_opacity=871
# 磨砂玻璃背景（悬浮球与弹窗共用）：1=开启（默认） 0=关闭
dock_remember_scroll=0
# 弹窗打开方式：0=鼠标划入（悬停）显示（默认） 1=仅点击显示
# 注：无论哪种方式，全屏游戏/全屏应用激活时都不会「划入」自动弹出（点击仍可打开）
dock_trigger=0
# 弹窗底部「进程列表」：proc_show=1 显示（默认）；三列默认都开；GPU 在 Linux/macOS 为估算值
proc_show=1
proc_show_cpu=1
proc_show_gpu=1
proc_show_mem=1
proc_refresh_ms=3000
proc_max_count=10
# 最多显示条数：0=无限制，其余为具体条数（5/8/10/15/20）
proc_sort=0
language=0

[ai]
# 弹窗右侧的 AI 助手区域（可关闭）：show=1 展开（默认） 0 收起
show=1
# 面板宽度（px）
width=360
# 模型协议：0=OpenAI 兼容（默认，覆盖绝大多数服务） 1=Anthropic Claude 2=Google Gemini
protocol=0
# 服务地址；留空则按协议用默认值（OpenAI: https://api.openai.com/v1）
base_url=
# API Key / Token（只保存在本机配置文件里）
api_key=
# 模型名；留空则用协议默认值
model=
# 可选的角色设定（系统提示词）
system_prompt=
# 采样温度 0.0~2.0
temperature=0.7
# 最大输出 tokens：0=不指定（Anthropic 协议内部按 4096 兜底）
max_tokens=0

[meta]
# 配置结构版本号：程序靠它对新装/老配置做一次性默认值迁移，一般不用手改。
#   1 → 磁盘读写默认显示（旧）
#   2 → 磁盘读写默认不显示（当前）
config_version=2

[timer]
update_data_interval=450
update_ui_interval=450

[window]
# 形状蒙版（桌面没开混成时用来裁掉矩形黑框）
# 0 = 自动  1 = 强制开启  2 = 关闭
shape_mask=0

[system_monitor]
# 右键菜单「系统监视器」调用的命令；留空 = 自动按桌面环境/窗口管理器检测。
# 可填绝对路径命令，也可带参数，例如：
#   Windows : C:\Windows\System32\Taskmgr.exe
#   Linux   : /usr/bin/resources 或 /usr/bin/gnome-system-monitor
#   macOS   : open -a "Activity Monitor"
cmd=
