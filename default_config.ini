[appearance]
aside_height=100
aside_width=30
charts_rows=32
cpu_freq_color=#fff
cpu_temp_color=#fff
cpu_usage_color=#4FB7DDFF
cpu_usage_width=1.1
height=100
main_border_color=#41B0DD
main_border_width=2
main_color=#13191C
mem_color=#2E6FC4
net_speed_color=#fff
opacity=0.91
shadow_radius=0
shadow_color=#000000
shape=0
swap_color=#8C2A5E93
width=100

[components_show]
cpu_freq_show=0
cpu_temp_show=1
net_speed_show=1

[aside]
# 贴边竖条：把小球拖到屏幕左/右边缘，会吸附成一根圆角竖条，用窄柱图显示各指标。
# 拖动竖条往屏幕里侧移开（或单击竖条）即可变回小球。
snap_to_edge=1
# 当前吸附在哪一侧：10 = 左边缘，11 = 右边缘（程序自己记，一般不用手改）
aside_edge=11
# 竖条圆角半径（px）；竖条宽度/高度见上面 appearance 段的 aside_width / aside_height
corner_radius=8

[position]
x=300
y=300

[timer]
update_data_interval=450
update_ui_interval=450

[window]
# 形状蒙版（桌面没开混成时用来裁掉矩形黑框）
# 0 = 自动  1 = 强制开启  2 = 关闭
shape_mask=0

[system_monitor]
# 右键菜单「系统监视器」调用的命令；留空 = 自动按桌面环境/窗口管理器检测。
# 可填绝对路径命令，也可带参数，例如：
#   Windows : C:\Windows\System32\Taskmgr.exe
#   Linux   : /usr/bin/gnome-system-monitor
#   macOS   : open -a "Activity Monitor"
cmd=
