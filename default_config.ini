[appearance]
aside_height=100
aside_width=40
charts_rows=32
cpu_freq_color=#fff
cpu_temp_color=#fff
cpu_usage_color=#4FB7DDFF
cpu_usage_width=1.1
height=100
main_border_color=#41B0DD
main_border_width=2
main_color=#13191C
mem_color=#2E6FC4
net_speed_color=#fff
opacity=0.91
shadow_radius=0
shadow_color=#000000
shape=0
swap_color=#8C2A5E93
width=100

[components_show]
cpu_freq_show=0
cpu_temp_show=1
net_speed_show=1

[position]
x=300
y=300

[timer]
update_data_interval=450
update_ui_interval=450

[window]
# 形状蒙版（桌面没开混成时用来裁掉矩形黑框）
# 0 = 自动  1 = 强制开启  2 = 关闭
shape_mask=0

[system_monitor]
# 右键菜单「系统监视器」调用的命令；留空 = 自动按桌面环境/窗口管理器检测。
# 可填绝对路径命令，也可带参数，例如：
#   Windows : C:\Windows\System32\Taskmgr.exe
#   Linux   : /usr/bin/gnome-system-monitor
#   macOS   : open -a "Activity Monitor"
cmd=
